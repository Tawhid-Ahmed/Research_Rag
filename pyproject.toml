[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation assistant over arXiv AI/ML papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arXiv RAG Assistant" }]
keywords = ["rag", "arxiv", "llm", "retrieval", "fastapi", "streamlit"]

# Runtime dependencies are pinned in requirements.txt (source of truth for
# reproducible installs). The looser bounds here document compatibility.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sse-starlette>=2.1,<3",
    "streamlit>=1.41,<2",
    "arxiv>=2.1,<3",
    "pypdf>=5.1,<6",
    "tiktoken>=0.8,<0.9",
    "httpx>=0.28,<0.29",
    "sentence-transformers>=3.3,<4",
    "chromadb>=0.5,<0.6",
    "rank-bm25>=0.2,<0.3",
    "tenacity>=9,<10",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<0.4"]
providers = ["openai>=1.59,<2", "anthropic>=0.42,<0.43", "huggingface-hub>=0.27,<0.28"]
observability = ["langfuse>=2.57,<3"]
eval = ["ragas>=0.2,<0.3", "datasets>=3.2,<4"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<0.9",
    "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "ui", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ui"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
